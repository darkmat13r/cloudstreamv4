# https://docs.gradle.org/current/userguide/plugins.html#sec:version_catalog_plugin_application
# https://docs.gradle.org/current/userguide/dependency_versions.html#sec:strict-version
[versions]
activity = "1.13.0"
androidGradlePlugin = "9.1.1"
animeDb = "1.0.2"
annotation = "1.10.0"
appcompat = "1.7.1"
biometric = "1.4.0-alpha07"
buildkonfigGradlePlugin = "0.21.2"
coil = { strictly = "3.3.0" } # Later versions require jvmTarget 11 or later
colorpicker = "6b46b49"
conscryptAndroid = { strictly = "2.5.2" } # 2.5.3 crashes everything
constraintlayout = "2.2.1"
coreKtx = "1.18.0"
cryptography = "0.6.0"
desugar_jdk_libs_nio = "2.1.5"
dokkaGradlePlugin = "2.2.0"
espressoCore = "3.7.0"
fragmentKtx = "1.8.9"
instancioCore = "5.6.0"
jacksonModuleKotlin = { strictly = "2.13.1" } # Later versions don't support minSdk <26 (Crashes on Android TV's and FireSticks)
json = "20260522"
jsoup = "1.22.1"
junit = "4.13.2"
junitKtx = "1.3.0"
junitVersion = "1.3.0"
juniversalchardet = "2.5.0"
filekit = "0.17.0" # :media:download only. It forces stdlib 2.4.21 and serialization 1.12.0 and needs minSdk 24, so a consumer such as :app inherits those; see docs/tasks/kmp.md.
kotlinGradlePlugin = "2.4.0"
kotlinxAtomicfu = "0.33.0"
kotlinxCollectionsImmutable = "0.4.0"
kotlinxCoroutines = "1.11.0"
kotlinxDatetime = "0.8.0"
kotlinxIOCore = "0.9.1"
kotlinxSerializationJson = "1.12.0"
# :library's own pin. 1.12.0 declares stdlib 2.4.10, and :library's POM must not lift the stdlib
# for extension authors (DEC entry for minSdk 24). The app build resolves 1.12.0 regardless.
kotlinxSerializationJsonLibrary = "1.11.0"
# :app's stdlib, set with `coreLibrariesVersion` in app/build.gradle.kts only. FileKit 0.17.0
# (:media:download) needs it; the compiler stays on kotlinGradlePlugin. Never applied to :library.
kotlinStdlibApp = "2.4.21"
ksoup = "0.2.6"
ktor = "3.6.0" # Also the ktor-http extensions use at runtime: URL parsing changed, see KtorUrlBehaviourTest and docs/plans/kmp-migration.md (I3)
lifecycleKtx = "2.10.0"
material = "1.14.0"
media3 = "1.9.3"
navigationKtx = "2.9.8"
newpipeextractor = "v0.26.3"
nextlibMedia3 = "1.9.3-0.12.0"
nicehttp = "0.4.18"
vlcj = "4.12.1" # Owner approved embedded playback 2026-11-02. GPL-3.0, needs VLC installed
jna = "5.19.1" # Owner approved 2026-11-09 for KMP-74: the Mac app hands a downloaded file to the media host as an open descriptor. Apache-2.0/LGPL-2.1; the version BUG-73 settles on
tablerIcons = "1.1.1" # Owner approved compose-icons 2026-11-02 (DEC-11); Tabler is the pack that covers the most. MIT. Last release 2024-09
dex2jar = "2.4.38" # Owner approved 2026-11-02. .cs3 -> JVM conversion; only ever runs inside the no-network sandbox
gson = "2.15.0" # Owner approved 2026-11-03 (KMP-23). For plugins that call it: desktop host only, never :app
overlappingpanels = "0.1.5"
paletteKtx = "1.0.0"
preferenceKtx = "1.2.1"
previewseekbarMedia3 = "1.1.1.0"
qrcodeKotlin = "4.5.0"
rhino = { strictly = "1.8.1" } # Requires minSdk 26 or later beginning at version 1.9.0
safefile = "0.0.8"
shimmer = "0.5.0"
torrentserver = "7861970"
tvprovider = "1.1.0"
video = "1.0.0"
workRuntimeKtx = "2.11.2"
zipline = "1.27.0"
composeMaterial3 = "1.12.0-alpha03"
composeMultiplatform = "1.12.0"
composeScreenshotPlugin = "0.0.1-alpha16"
# The AndroidX Compose that Compose Multiplatform 1.12.0 resolves to on Android.
# Only the screenshotTest source set needs it directly — the preview renderer is AndroidX.
androidxComposeUi = "1.11.0"
# Device tests only (owner approved, test scope; INF-10). 1.12.0 and not `androidxComposeUi`: this is what
# `:feature:*`'s Android runtime classpath actually resolves `androidx.compose.ui:ui` to on CMP 1.12.0.
androidxComposeUiTest = "1.12.0"
androidxTestRunner = "1.7.0" # Latest stable. 1.8.0-alpha03 is newer and not stable.
androidxTestRules = "1.7.0"
androidxUiautomator = "2.4.0"
lifecycleViewmodelCompose = "2.11.0"

# jvmTarget = "11" is needed for compose, otherwise you will get
# "Cannot inline bytecode built with JVM target 11 into bytecode" or
# "Error was captured in composition. java.lang.AbstractMethodError"
jvmTarget = "11"
jdkToolchain = "17"
minSdk = "24"
# :library stays on 23 so that extensions built at minSdk 23 keep merging its manifest. The app moved
# to 24 for FileKit 0.17.0 (:media:download); see the DEC entry for minSdk 24.
libraryMinSdk = "23"
compileSdk = "37"
targetSdk = "36"

versionCode = "68"
versionName = "4.8.0"

