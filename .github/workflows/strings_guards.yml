name: Strings guards

# Translations reach master by push (Weblate, then update_locales.yml), where pull_request.yml never runs.
# This runs :core:strings' generator on those pushes with -Pcloudstream.strings.guards=report: content guards
# (Unicode whitespace, unresolvable references, unmodelled directories, ...) become warning annotations and do not
# fail the push. aapt2 failures, DOCTYPEs and other BROKEN findings still fail, because the same input breaks :app.
# Pull requests run the same guards in fail mode through `check` in pull_request.yml.
#
# A separate workflow rather than a step in an existing push workflow: update_locales.yml and prerelease.yml hold
# GitHub App tokens and signing secrets and use cancel-in-progress concurrency, and neither should run Gradle
# for a check that must neither fail nor be cancelled by the next translation push.

on:
  push:
    branches: [ master ]
    paths:
      - 'app/src/main/res/values*/strings.xml'
      - 'app/src/main/res/values*/donottranslate-strings.xml'
      - 'core/strings/**'
      - 'build-logic/convention/src/main/kotlin/strings/**'
      - 'build-logic/convention/src/main/kotlin/cloudstream.kmp.strings.gradle.kts'
      - 'build-logic/convention/src/main/resources/strings/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-read-only: true

    - name: Generate Compose strings (guards report)
      run: ./gradlew :core:strings:generateComposeStrings -Pcloudstream.strings.guards=report

    - name: Annotate findings
      if: always()
      shell: python3 {0}
      run: |
        import os, pathlib, re
        findings = pathlib.Path("core/strings/build/stringsOracle/findings.tsv")
        if not findings.exists():
            print("::error title=strings guards::generateComposeStrings wrote no findings.tsv")
            raise SystemExit(1)

        def data(text):
            return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

        def prop(text):
            return data(text).replace(",", "%2C").replace(":", "%3A")

        def unescape(cell):
            return re.sub(r"\\(.)", lambda m: {"n": "\n", "t": "\t", "r": "\r"}.get(m.group(1), m.group(1)), cell)

        counts = {}
        for line in findings.read_text(encoding="utf-8").splitlines():
            severity, kind, location, key, message = line.split("\t", 4)
            counts[(severity, kind)] = counts.get((severity, kind), 0) + 1
            if severity == "INFO":
                continue
            if location == "parity-requests":
                path = "core/strings/parity-requests.txt"
            else:
                path = "app/src/main/res/" + location
            command = "error" if severity == "BROKEN" else "warning"
            text = (key + ": " if key else "") + unescape(message)
            # Translations are untrusted: every value is escaped so it cannot start another workflow command.
            print(f"::{command} file={prop(path)},title={prop('strings ' + kind)}::{data(text)}")

        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
            summary.write("### :core:strings guards (report mode)\n\n| severity | finding | count |\n|---|---|---|\n")
            for (severity, kind), n in sorted(counts.items()):
                summary.write(f"| {severity} | {kind} | {n} |\n")
