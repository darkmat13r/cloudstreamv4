name: Artifact Build

on: [pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-read-only: false

    - name: Ensure binary compatibility
      # This is to ensure that your code is backwards compatible.
      # If this fails in :library you need to add a @Prerelease annotation to new code.
      # Runs in every project with abiValidation: :library and each cloudstream.kmp.extension-api module.
      # In a :core module, record an intended change with `./gradlew :core:x:updateKotlinAbi` and review the api/ diff.
      run: ./gradlew checkKotlinAbi

    - name: Run Gradle
      run: ./gradlew assemblePrereleaseDebug lint check

    - name: Check classes.jar ABI
      # classes.jar is what third-party extensions compile against; this diffs it, :app included, against app/api/classes-jar.api.
      # Not part of `check`: makeJar depends on build, so it runs as its own step.
      # Record an intended change with `./gradlew :app:dumpExtensionApi` and review the api/ diff.
      run: ./gradlew :app:checkExtensionApi

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pull-request-build
        path: "app/build/outputs/apk/prerelease/debug/*.apk"
